name: Portfolio update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update portfolio content
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()

          # Replace ShopCraft with the Kaixy project.
          old = "{ number: '04', title: 'ShopCraft', type: 'E-COMMERCE WEB APP', description: 'A practical shopping experience concept focused on product discovery, browsing flows and a clean customer journey.', tags: ['Web App', 'E-Commerce', 'UX', 'Testing'], accent: 'purple', href: '#contact' }"
          new = "{ number: '04', title: 'Kaixy', type: 'E-COMMERCE WEB APP', description: 'A modern shopping experience focused on product discovery, browsing flows and a polished customer journey.', tags: ['React', 'E-Commerce', 'UX', 'Testing'], accent: 'purple', href: 'https://kaixy.vercel.app/' }"
          if old in s:
              s = s.replace(old, new)

          # Add Core Java alongside the existing QA/automation skills.
          old_service = "  ['05', 'Selenium', 'Practical browser automation skills focused on stable, maintainable test flows.'],"
          new_service = "  ['05', 'Core Java', 'Core Java fundamentals for test automation, object-oriented programming and problem solving.'],\n  ['06', 'Selenium', 'Practical browser automation skills focused on stable, maintainable test flows.'],"
          if old_service in s:
              s = s.replace(old_service, new_service)
              s = s.replace('<span>05</span></div></div>', '<span>06</span></div></div>', 1)

          # Keep project count accurate.
          s = s.replace('<h2>PROJECTS</h2><span>04</span>', '<h2>PROJECTS</h2><span>04</span>')

          # Make the visual mark understand Kaixy while preserving the existing purple styling.
          s = s.replace(": accent === 'purple' ? 'SHOPCRAFT' : 'QRSERVE'", ": accent === 'purple' ? 'KAIXY' : 'QRSERVE'")

          p.write_text(s)

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Update portfolio skills and replace ShopCraft with Kaixy"
          git push
